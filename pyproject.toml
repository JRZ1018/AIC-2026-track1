[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "aictrack1"
version = "0.1.0"
description = "Reproducible single-model pipeline for the AIC noisy-label fine-grained recognition track"
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.0",
  "Pillow>=10",
  "PyYAML>=6",
  "torch>=2.5",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]
